<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Progress Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock-background">
        <div class="clock-container">
            <div class="ring hours" id="hour-ring">
                <div class="ring minutes" id="minute-ring">
                    <div class="ring seconds" id="second-ring"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
