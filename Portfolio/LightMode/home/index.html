<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="home-container">
    
    <!-- the subject and the Halo -->
 <div class="subject-container">
  <div class="halo"></div>
  <div class="subject"></div>
</div>


    <!-- Logo -->
    <div class="logo">
      <img src="../../Assets/W-Logo.png" alt="Logo">
    </div>

    <!-- Menu Button -->
    <div class="menu-button">
      <div class="menu-dot"></div>
      <span class="menu-text">menu</span>
    </div>

    <!-- Welcome Card -->
    <div class="welcome-card">
      <div class="welcome-header">
        <div class="welcome-dot"></div>
        <h2 class="welcome-title">Welcome!</h2>
      </div>
      <p class="welcome-description">
        Combining aesthetics and usefulness, I create solid user interfaces in an artistic way. I love to spend time improving the aesthetics of digital products without forgetting about usability.
      </p>
      <div class="explore-button">
        <span class="explore-text">explore</span>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
