<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>menu</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="home-container">
    <!-- Logo (top-left) -->
    <div class="logo">
      <img src="../../Assets/B-Logo.png" alt="Logo">
    </div>

    <!-- Close Button -->
    <div class="close-button">
      <div class="close-dot"></div>
      <span class="close-text">close</span>
    </div>

    <!-- Menu Texts -->
    <nav class="menu-links" aria-label="Primary">
      <div class="label"><div class="home">HOME</div></div>
      <div class="label"><div class="about">ABOUT</div></div>
      <div class="label"><div class="work">WORK</div></div>
    </nav>
    

    <!-- Blur Overlay (everything except logo & close button) -->
    <div class="blur-overlay"></div>

    <!-- Central Figure with Halo -->
    <div class="subject-container">
      <div class="halo"></div>
      <div class="subject"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
